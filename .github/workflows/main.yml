name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run:
    name: build  # build+test on various versions of OCaml, on linux
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        container:
          - ghcr.io/c-cube/c-cube-commmon/ci-5.4:latest

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: apt update && opam install -t . ./vendor/calculon/calculon.opam ./vendor/calculon/calculon-web.opam ./vendor/irky/irky.opam ./vendor/irky/irky-eio.opam --deps-only
      - run: opam exec -- dune build @install

